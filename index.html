<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Recipe Book (Google Drive)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f4;--surface:#fff;--ink:#2b2b2b;--muted:#767676;--line:#e4e4e4;--accent:#f2b01e;--accent-ink:#2b2b2b;--accent-text:#8a5a00;--soft:#fdf3d8;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--surface:#222;--ink:#f0f0f0;--muted:#a0a0a0;--line:#383838;--accent:#f2b84b;--accent-ink:#161616;--accent-text:#f2b84b;--soft:#3a3020}}
:root[data-theme="dark"]{--bg:#161616;--surface:#222;--ink:#f0f0f0;--muted:#a0a0a0;--line:#383838;--accent:#f2b84b;--accent-ink:#161616;--accent-text:#f2b84b;--soft:#3a3020}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:background .25s,color .25s,box-shadow .25s}
.top.clear{background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0));color:#fff;box-shadow:none}
.top h1{margin:0;font:700 34px/1 'Caveat','Segoe Script','Bradley Hand',cursive}
.wrap{max-width:760px;margin:0 auto;padding:calc(84px + env(safe-area-inset-top,0px)) 14px 80px}
body.rv .wrap{max-width:1080px;padding-top:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:700}
.top .btn{background:var(--accent-ink);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent-text);border:1.5px solid var(--accent)}
.btn.danger{background:transparent;color:#c0392b;border:1.5px solid #c0392b}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#search{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.card .ph{aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:40px}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:10px 12px 12px}
.card h3{margin:0;font-size:16px}
.card p{margin:2px 0 0;color:var(--muted);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:48px 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block}
.hero.none{background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:64px}
.gal{display:flex;gap:8px;overflow-x:auto;margin:8px 0 14px}
.gal img{height:64px;border-radius:8px;cursor:pointer}
h2.name{font-size:26px;line-height:1.2;margin:12px 0 4px}
.tags{color:var(--muted);font-size:14px;margin-bottom:12px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.meta div{background:var(--surface);padding:10px 12px}
.meta small{display:block;color:var(--muted);font-size:12px}
.meta b{font-size:16px}
h3.sec{margin:0 0 10px;font-size:20px;color:var(--accent-text)}
.srv{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.srv button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent-text);font-size:20px;cursor:pointer;line-height:1}
ul.ing{padding:0;margin:0;list-style:none}
ul.ing li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
ul.ing li:last-child{border:0}
ul.ing input{width:20px;height:20px;accent-color:var(--accent-text)}
ul.ing li.done span{text-decoration:line-through;color:var(--muted)}
.step{margin-bottom:16px}
.step b{color:var(--accent-text);display:block;margin-bottom:2px}
.tip{background:var(--soft);border-radius:10px;padding:12px 14px}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
input[type=text],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:110px;resize:vertical}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;margin-bottom:8px}
.row input{flex:1}
.row .x{flex:none;width:42px;padding:0}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.photos .p{position:relative;width:96px;height:96px}
.photos img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.photos .p button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer}
.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.rhero{position:relative;width:100vw;margin-left:calc(50% - 50vw);height:clamp(300px,58vh,560px);background:linear-gradient(135deg,var(--accent),var(--soft));overflow:hidden;color:#fff}
.rhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rhero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 40%,rgba(0,0,0,.65));pointer-events:none}
.rhero.none{color:var(--accent-ink)}
.rhero.none::after{display:none}
.rhero .emo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;opacity:.5}
.rback{position:absolute;z-index:2;top:calc(78px + env(safe-area-inset-top,0px));left:14px;background:rgba(255,255,255,.92);color:#2b2b2b;border:0;border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.rcap{position:absolute;z-index:1;left:0;right:0;bottom:0;max-width:1080px;margin:0 auto;padding:0 18px 22px}
.rcap .name{font-family:'Caveat','Segoe Script','Bradley Hand',cursive;font-weight:700;font-size:clamp(40px,7vw,68px);line-height:1;margin:0 0 6px;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.rhero.none .name{text-shadow:none}
.rcap .tags{color:inherit;opacity:.95;margin:0}
.cats{display:flex;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin:14px 0;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:1 0 108px;min-width:108px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--ink);padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.cat:last-child{border-right:0}
.cat .ic{font-size:26px;line-height:1.2}
.cat.on{background:var(--soft);color:var(--accent-text);font-weight:700}
.catpick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.cpick{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.cpick.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rgrid{display:grid;gap:14px}
.rgrid .panel{margin-bottom:0}
@media (min-width:900px){
  .rgrid{grid-template-columns:300px 1fr;align-items:start}
  .ring{grid-column:1;grid-row:1/span 2;position:sticky;top:calc(76px + env(safe-area-inset-top,0px));z-index:1;max-height:calc(100vh - 96px);overflow:auto}
  .rsteps{grid-column:2;grid-row:1}
  .rmedia{grid-column:1/-1;grid-row:2;position:relative;z-index:2}
}
.rsteps>.tip{margin-top:14px}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.car>*{flex:0 0 100%;aspect-ratio:16/10;object-fit:cover;scroll-snap-align:center;border-radius:10px;display:block;background:var(--soft)}
.car.p{gap:0}
.car.p>*{border-radius:0}
.car.v>*{flex:0 0 min(100%,320px);aspect-ratio:16/9}
.vslide{position:relative;background:#000;overflow:hidden}
.vslide video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
.vload{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:#1b1b1b;text-align:center;padding:8px}
.vmute{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px}
.vslide .vbtn{width:100%;height:100%;border:0;background:#1b1b1b;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:8px;font-size:28px}
.vslide .vbtn small{font-size:12px;opacity:.8;max-width:90%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;justify-content:center;gap:6px;margin:8px 0 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent-text)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay.bottom{align-items:flex-end;padding:0}
.sheet{position:relative;width:100%;max-width:480px;background:var(--surface);border-radius:16px 16px 0 0;padding:56px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;animation:slideUp .22s ease-out}
.xbtn{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.xbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes slideDown{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:700px){
  #sheet{background:transparent;align-items:flex-start;justify-content:flex-start;padding:0}
  .sheet{position:fixed;width:260px;border-radius:12px;padding:16px 16px 60px;box-shadow:0 8px 28px rgba(0,0,0,.28);border:1px solid var(--line);animation:slideDown .2s ease-out}
  .xbtn{top:auto;right:auto;bottom:12px;left:12px}
}
.dlg{width:100%;max-width:380px;background:var(--surface);border-radius:14px;padding:18px}
.hidden{display:none}
</style>
</head>
<body>
<div class="top" id="top"><h1>My Recipe Book</h1><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="set">Settings</button><button class="btn" id="lock" aria-label="Google connection settings" style="display:inline-flex;align-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button><button class="btn" id="add">Add recipe</button></span></div><input type="file" id="impfile" accept=".json,application/json" class="hidden">
<div class="wrap">
  <div id="list">
    <div id="status" style="color:var(--muted);font-size:13px;margin:0 0 8px">Not signed in. Tap “Sign in with Google”.</div>
    <div id="cats"></div>
    <input id="search" type="text" placeholder="Search recipes or ingredients" aria-label="Search recipes">
    <div id="grid" class="grid"></div>
  </div>
  <div id="view" class="hidden"></div>
  <div id="json" class="hidden panel">
    <h3 class="sec">Recipes as JSON</h3>
    <p style="color:var(--muted);margin-top:0">This is all your data. You can edit it here and apply it, or copy it as a backup.</p>
    <textarea id="jtext" style="min-height:320px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace" spellcheck="false"></textarea>
    <div class="actions"><button class="btn" id="japply">Apply changes</button><button class="btn ghost" id="jback">Close</button></div>
  </div>
  <form id="form" class="hidden panel" onsubmit="return false">
    <h3 class="sec" id="ftitle">New recipe</h3>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Spaghetti carbonara">
    <div class="cols">
      <div><label for="serv">Servings</label><input type="number" id="serv" min="1" placeholder="2"></div>
      <div><label for="diff">Difficulty</label><select id="diff"><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
      <div><label for="prep">Prep (min)</label><input type="number" id="prep" min="0"></div>
      <div><label for="cook">Cooking (min)</label><input type="number" id="cook" min="0"></div>
      <div><label for="rest">Rest (min)</label><input type="number" id="rest" min="0"></div>
      <div><label for="cost">Cost</label><select id="cost"><option>Cheap</option><option>Average</option><option>Expensive</option></select></div>
    </div>
    <label>Categories</label>
    <div class="catpick" id="catpick"></div>
    <div class="row"><input type="text" id="newcat" placeholder="New category (e.g. Vegan)"><button type="button" class="btn ghost" id="addcat">Add</button></div>
    <label>Photos</label>
    <div class="photos" id="photos"></div>
    <input type="file" id="file" accept="image/*" multiple class="hidden">
    <button class="btn ghost" type="button" id="addphoto">Add photos</button>
    <label>Videos</label>
    <div id="vlist"></div>
    <input type="file" id="vfile" accept="video/*" multiple class="hidden">
    <button class="btn ghost" type="button" id="addvid">Add videos</button>
    <label>Ingredients (start with the quantity, e.g. 200g pasta)</label>
    <div id="ings"></div>
    <button class="btn ghost" type="button" id="adding">Add ingredient</button>
    <label for="steps">Steps (one per line)</label>
    <textarea id="steps" placeholder="Boil the pasta&#10;Fry the bacon"></textarea>
    <label for="tip">Tips and notes</label>
    <textarea id="tip" style="min-height:70px"></textarea>
    <div class="actions">
      <button class="btn" type="button" id="save">Save recipe</button>
      <button class="btn ghost" type="button" id="cancel">Cancel</button>
    </div>
  </form>
</div>

<div id="sheet" class="overlay bottom hidden"><div class="sheet">
  <button class="xbtn" id="sclose" aria-label="Close menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button class="btn ghost" id="sign">Sign in with Google</button>
  <button class="btn ghost" id="exp">Export JSON</button>
  <button class="btn ghost" id="imp">Import</button>
  </div></div>
<div id="lockm" class="overlay hidden"><div class="dlg">
  <h3 class="sec">Google connection</h3>
  <label for="cid">Google OAuth Client ID</label><input type="text" id="cid">
  <label for="fold">Drive folder link</label><input type="text" id="fold">
  <div class="actions"><button class="btn" id="lsave">Save</button><button class="btn ghost" id="lclose">Cancel</button></div>
</div></div>
<div id="signm" class="overlay hidden"><div class="dlg" style="text-align:center">
  <h3 class="sec">Sign in</h3>
  <p style="margin-top:0">Sign in with Google to open and edit the shared recipes.</p>
  <button class="btn" id="signbtn">Sign in with Google</button>
  <div class="actions" style="justify-content:center"><button class="btn ghost" id="sklip">Not now</button></div>
</div></div>
<script>
var KEY='recipe-book-drive-cache', SEED='recipe-book-seed-carbonara', recipes=[], cur=null, factor=1, DB=null, ASSETS=null, canWrite=true;
var $=function(i){return document.getElementById(i)};
var CARBONARA={"id": "carbonara", "ts": 1, "name": "Carbonara", "serv": 2, "prep": 10, "cook": 15, "rest": 0, "diff": "Easy", "cost": "Cheap", "ings": ["200g pasta", "250g bacon", "150g pecorino", "6 egg yolks", "Black pepper", "Pot of water for the pasta", "Pot for the eggs"], "photos": ["data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 500'><rect width='800' height='500' fill='%23efe3cf'/><ellipse cx='400' cy='300' rx='330' ry='170' fill='%23ffffff'/><ellipse cx='400' cy='295' rx='265' ry='135' fill='%23ececec'/><ellipse cx='400' cy='280' rx='205' ry='98' fill='%23f4d884'/><g fill='none' stroke='%23e2b64f' stroke-width='9' stroke-linecap='round'><path d='M235 280C300 205 500 205 565 280'/><path d='M260 300C330 235 470 235 540 300'/><path d='M290 260C350 225 450 225 510 260'/><path d='M300 315C360 275 440 275 500 315'/></g><g fill='%238a3b2b'><rect x='330' y='235' width='34' height='14' rx='4' transform='rotate(-20 347 242)'/><rect x='430' y='250' width='36' height='14' rx='4' transform='rotate(25 448 257)'/><rect x='380' y='290' width='32' height='14' rx='4' transform='rotate(10 396 297)'/><rect x='470' y='295' width='30' height='13' rx='4' transform='rotate(-30 485 301)'/><rect x='300' y='290' width='30' height='13' rx='4' transform='rotate(35 315 296)'/></g><g fill='%23333'><circle cx='360' cy='270' r='3'/><circle cx='410' cy='240' r='3'/><circle cx='450' cy='285' r='3'/><circle cx='340' cy='305' r='3'/><circle cx='500' cy='265' r='3'/><circle cx='395' cy='318' r='3'/><circle cx='430' cy='225' r='3'/></g></svg>"], "steps": "Cook the bacon.\nGrate the pecorino.\nTake the yolks and mix them with the pecorino in a bowl.\nAdd the bacon fat to the egg mixture.\nAdd some pasta water to the egg mixture (keep it thick).\nAdd pepper.\nAdd the bacon.\nAdd the pasta and mix well.", "tip": "My own recipe. You need two pots: one with water for the pasta and one for the eggs."};
function load(){try{var r=localStorage.getItem(KEY);recipes=r?JSON.parse(r):[]}catch(e){recipes=[]}
  if(!Array.isArray(recipes))recipes=[];
  var seeded=false;try{seeded=localStorage.getItem(SEED)}catch(e){}
  if(false){recipes.unshift(CARBONARA);try{localStorage.setItem(SEED,'1')}catch(e){}persist()}}
function persist(){if(DB)return true;try{localStorage.setItem(KEY,JSON.stringify(recipes,function(k,v){return (k==='_imgs'||k==='_pend'||k==='_oldFiles'||k==='_vpend'||k==='_oldVids')?undefined:v}));return true}catch(e){alert('Could not save. Browser storage is full or unavailable. Try removing some photos.');return false}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function updateTop(){$('top').classList.toggle('clear',document.body.classList.contains('rv')&&window.scrollY<60)}
window.addEventListener('scroll',updateTop,{passive:true});
function show(w){['list','view','form','json'].forEach(function(i){$(i).classList.toggle('hidden',i!==w)});document.body.classList.toggle('rv',w==='view');window.scrollTo(0,0);updateTop()}
function fmt(m){m=+m||0;if(!m)return '–';return m>=60?Math.floor(m/60)+' h'+(m%60?' '+m%60:''):m+' min'}
function scale(s,f){if(f===1)return s;return s.replace(/^(\d+(?:[.,]\d+)?)/,function(n){var v=parseFloat(n.replace(',','.'))*f;return String(Math.round(v*100)/100)})}

var DEFCATS=[['Starter','🥗'],['Main course','🍽️'],['Dessert','🍰'],['Italian','🍝'],['Peruvian','🌶️'],['Japanese','🍣'],['Other','✨']],catFilter='',catPick=[];
function catIcon(c){var d=DEFCATS.filter(function(x){return x[0]===c})[0];return d?d[1]:'🏷️'}
function catTiles(list,active,noAll){var h=list.map(function(c){return '<button class="cat'+(c===active?' on':'')+'" data-c="'+esc(c)+'"><span class="ic">'+catIcon(c)+'</span>'+esc(c)+'</button>'});
  if(!noAll)h.unshift('<button class="cat'+(active===''?' on':'')+'" data-c=""><span class="ic">📖</span>All</button>');
  return '<div class="cats">'+h.join('')+'</div>'}
function usedCats(){var u=[];DEFCATS.forEach(function(d){if(recipes.some(function(r){return (r.cats||[]).indexOf(d[0])>-1}))u.push(d[0])});
  recipes.forEach(function(r){(r.cats||[]).forEach(function(c){if(u.indexOf(c)<0)u.push(c)})});return u}
function renderCats(){var u=usedCats();if(catFilter&&u.indexOf(catFilter)<0)catFilter='';$('cats').innerHTML=u.length?catTiles(u,catFilter):''}
function allCats(){var a=DEFCATS.map(function(x){return x[0]});recipes.forEach(function(r){(r.cats||[]).forEach(function(c){if(a.indexOf(c)<0)a.push(c)})});catPick.forEach(function(c){if(a.indexOf(c)<0)a.push(c)});return a}
function renderCatPick(){$('catpick').innerHTML=allCats().map(function(c){return '<button type="button" class="cpick'+(catPick.indexOf(c)>-1?' on':'')+'" data-c="'+esc(c)+'">'+catIcon(c)+' '+esc(c)+'</button>'}).join('')}
function renderList(){

      return fetch(p.u).then(function(r){return r.blob()}).then(function(b){return upload('POST',null,{name:nm2,parents:[cfgv().folder],mimeType:'image/jpeg'},'image/jpeg',b)})
    })).then(function(files){
      old.forEach(function(f){if(!keep[f.id])driveTrash(f.id,true)});
      rec._imgFiles=files.map(function(f){return {id:f.id,name:f.name}});rec._pend=null;rec._oldFiles=null;persist()})}
  var pv=Promise.resolve();
  if(rec._vpend){
    var vp=rec._vpend,vn=vp.length,vkeep={},vold=rec._oldVids||[];
    if(vp.some(function(p){return p.file}))status('Uploading video(s), please keep this page open…');
    pv=Promise.all(vp.map(function(p,i){var suf=vn>1?'_'+(i+1):'';
      if(p.f){vkeep[p.f.id]=1;var ext=(p.f.name.match(/\.[^.]+$/)||['.mp4'])[0],nm=base+suf+ext;return p.f.name===nm?{id:p.f.id,name:nm}:renameFile(p.f.id,nm)}
      var ext2=(p.file.name.match(/\.[^.]+$/)||['.mp4'])[0].toLowerCase(),ty=p.file.type||'video/mp4';
      return upload('POST',null,{name:base+suf+ext2,parents:[cfgv().folder],mimeType:ty},ty,p.file)
    })).then(function(files){vold.forEach(function(f){if(!vkeep[f.id])driveTrash(f.id,true)});
      rec._vids=files.map(function(f){return {id:f.id,name:f.name}});rec._vpend=null;rec._oldVids=null;persist()})}
  Promise.all([pj,pi,pv]).then(function(){status('Saved to Drive')}).catch(function(e){if(e.message!=='auth'){status('Not saved');alert('Could not save to Drive: '+String(e.message).slice(0,150))}})}
function driveTrash(fid,q){api('https://www.googleapis.com/drive/v3/files/'+fid+'?supportsAllDrives=true',{method:'PATCH',headers:{'Content-Type':'application/json'},body:'{"trashed":true}'}).then(function(){if(!q)status('Deleted')}).catch(function(e){if(e.message!=='auth')alert('Could not delete in Drive.')})}
$('sign').onclick=function(){TOKEN?refresh():signIn()};
$('set').onclick=function(){var p=document.querySelector('#sheet .sheet');
  if(window.matchMedia('(min-width:700px)').matches){var r=$('set').getBoundingClientRect();p.style.top=(r.bottom+8)+'px';p.style.right=Math.max(8,window.innerWidth-r.right)+'px'}
  else{p.style.top='';p.style.right=''}
  $('sheet').classList.remove('hidden')};
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('sheet').classList.add('hidden')});
$('sheet').onclick=function(e){if(e.target===$('sheet')||e.target.closest('button'))$('sheet').classList.add('hidden')};
$('lock').onclick=function(){var c=cfgv();$('cid').value=c.cid;$('fold').value=c.folder;$('lockm').classList.remove('hidden')};
$('lclose').onclick=function(){$('lockm').classList.add('hidden')};
$('lsave').onclick=function(){var a=$('cid').value.trim(),b=$('fold').value.trim(),m=b.match(/folders\/([-\w]+)/)||b.match(/[?&]id=([-\w]+)/);
  if(a)lsSet('rb-cid',a);if(b)lsSet('rb-folder',m?m[1]:b);$('lockm').classList.add('hidden');
  if(TOKEN){TOKEN=null;$('sign').textContent='Sign in with Google';status('Connection changed. Sign in again.');$('signm').classList.remove('hidden')}};
$('signbtn').onclick=function(){$('signm').classList.add('hidden');signIn()};
$('sklip').onclick=function(){$('signm').classList.add('hidden')};
$('impfile').onchange=function(){var f=$('impfile').files[0];if(!f)return;var rd=new FileReader();
  rd.onload=function(){var list;try{list=parseList(rd.result)}catch(e){alert('This file is not a valid recipes JSON file.');return}
    if(!TOKEN){alert('Sign in with Google first.');return}
    list.forEach(function(r){var i=recipes.findIndex(function(x){return x.id===r.id});if(i>-1){r._fid=recipes[i]._fid;r._multi=recipes[i]._multi;recipes[i]=r}else recipes.push(r);driveSave(r)});
    persist();renderList()};
  rd.readAsText(f);$('impfile').value=''};
$('cats').onclick=function(e){var b=e.target.closest('.cat');if(!b)return;catFilter=b.dataset.c;renderList()};
$('catpick').onclick=function(e){var b=e.target.closest('button');if(!b)return;var c=b.dataset.c,i=catPick.indexOf(c);if(i>-1)catPick.splice(i,1);else catPick.push(c);renderCatPick()};
$('addcat').onclick=function(){var v=$('newcat').value.trim();if(!v)return;if(catPick.indexOf(v)<0)catPick.push(v);$('newcat').value='';renderCatPick()};
load();renderList();$('signm').classList.remove('hidden');
</script>
